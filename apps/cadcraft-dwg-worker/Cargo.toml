[package]
name = "cadcraft-dwg-worker"
description = "CADCraft for the web: the Web Worker that reads and writes DWG files, so a DWG the reader fails on stops the worker, not the app (built by trunk from apps/cadcraft-web)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "cadcraft-dwg-worker"
path = "src/main.rs"

[dependencies]
# `web`: the DWG converter is built for wasm32 here (and only here).
cadcraft-dwg = { workspace = true, features = ["web"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
