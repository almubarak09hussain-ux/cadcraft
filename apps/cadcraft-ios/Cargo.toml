[package]
name = "cadcraft-ios"
description = "CADCraft for iPad (eframe on UIKit through winit, Metal through wgpu); also runs on the desktop for testing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "cadcraft-ios"
path = "src/main.rs"

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-ui-egui = { workspace = true }
cadcraft-io = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"

# The desktop test build on Linux and the BSDs needs a windowing backend.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
