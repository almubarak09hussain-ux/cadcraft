[package]
name = "cadcraft-ios"
description = "CADCraft for iPad (eframe on winit's UIKit backend, wgpu on Metal)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "cadcraft-ios"
path = "src/main.rs"

[dependencies]
cadcraft-engine = { workspace = true }
cadcraft-ui-egui = { workspace = true }
cadcraft-io = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence"] }
